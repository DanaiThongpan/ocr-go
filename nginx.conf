worker_processes auto;

events {
    worker_connections 1024;
}

http {
    # Logging configuration
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    # Tuning parameters for OCR
    client_max_body_size 50M;      # Allow up to 50MB file uploads
    keepalive_timeout 65;          # Connection timeout
    proxy_connect_timeout 600;     # OCR can take time, allow long proxy timeout
    proxy_send_timeout 600;
    proxy_read_timeout 600;
    send_timeout 600;

    # Load balancer block using "Least Connections" algorithm
    upstream ocr_backend {
        least_conn; # Distribute to the container with the fewest active connections
        server ocr-api-1:8080;
        server ocr-api-2:8080;
        server ocr-api-3:8080;
    }

    server {
        listen 80;

        # Main API endpoints
        location /api/ {
            proxy_pass http://ocr_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Real-time SSE logs proxy
        location /logs/live {
            proxy_pass http://ocr_backend;
            # SSE specific settings to prevent buffering
            proxy_http_version 1.1;
            proxy_set_header Connection '';
            chunked_transfer_encoding off;
            proxy_buffering off;
            proxy_cache off;
        }
    }
}
